# ConstraintTemplate, объединяющий три требования:
#   1) runAsNonRoot: true (на pod-уровне или на каждом контейнере)
#   2) runAsUser != 0
#   3) readOnlyRootFilesystem: true на каждом контейнере
# По заданию: «Только runAsNonRoot: true» и «readOnlyRootFilesystem: true обязательно».
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsrunasnonroot
spec:
  crd:
    spec:
      names:
        kind: K8sPSRunAsNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsrunasnonroot

        # ── runAsNonRoot должен быть установлен в true (pod-level или container-level)
        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not container_runs_as_non_root(c)
          msg := sprintf("Container %v must set runAsNonRoot: true", [c.name])
        }

        container_runs_as_non_root(c) {
          c.securityContext.runAsNonRoot == true
        }
        container_runs_as_non_root(_) {
          input.review.object.spec.securityContext.runAsNonRoot == true
        }

        # ── runAsUser не должен быть 0
        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          c.securityContext.runAsUser == 0
          msg := sprintf("Container %v cannot run as UID 0", [c.name])
        }

        violation[{"msg": msg}] {
          input.review.object.spec.securityContext.runAsUser == 0
          msg := "Pod cannot run as UID 0 at pod-level securityContext"
        }

        # ── readOnlyRootFilesystem обязателен и должен быть true
        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not c.securityContext.readOnlyRootFilesystem
          msg := sprintf("Container %v must set readOnlyRootFilesystem: true", [c.name])
        }

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          c.securityContext.readOnlyRootFilesystem == false
          msg := sprintf("Container %v has readOnlyRootFilesystem: false (must be true)", [c.name])
        }
