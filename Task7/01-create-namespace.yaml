# Namespace audit-zone с включённым Pod Security Admission на уровне restricted.
# Три режима:
#   - enforce — блокирует деплой подов, нарушающих policy (admission failure)
#   - audit   — пишет в audit-лог нарушения, не блокирует
#   - warn    — выдаёт warning в kubectl, не блокирует
# Уровень `restricted` — самый строгий из трёх (privileged / baseline / restricted).
# Полный список требований:
# https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
apiVersion: v1
kind: Namespace
metadata:
  name: audit-zone
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
