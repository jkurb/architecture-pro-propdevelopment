# Политика аудита Kubernetes API server.
# Уровни:
#   - RequestResponse — полный лог запроса и ответа (включая тело).
#     Применяется к чувствительным ресурсам (secrets, RBAC, pods и т.д.).
#   - Metadata — только метаданные запроса (без тела).
#     Без указания resources => применяется ко всему остальному
#     (нельзя использовать group: "*" — невалидно по RFC 1123).
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    verbs: ["create", "delete", "update", "patch", "get", "list"]
    resources:
      - group: ""
        resources: ["pods", "secrets", "configmaps", "serviceaccounts"]
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  - level: Metadata
